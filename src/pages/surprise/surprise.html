<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>?! | Bedirhan Ramzi</title>
    <link rel="stylesheet" href="surprise.css" />
    <script type="module" src="surprise.js"></script>
  </head>
  <body>
    <header class="site-header"></header>
    <main id="main">
      <header class="page-hero surprise-hero">
        <div class="container">
          <p class="eyebrow">Den åttonde sidan</p>
          <h1>Du hittade den!</h1>
          <p class="lead">
            Tack för att du tog dig tid att kika igenom min sida!
          </p>
        </div>
      </header>

      <section class="section">
        <div class="container">
          <article class="card surprise-card">
            <span class="surprise-symbol" aria-hidden="true">?!</span>
            <div class="surprise-content">
              <p class="eyebrow">Ett sista meddelande</p>
              <h2>Nyfikenhet är en bra egenskap.</h2>
              <p>
                Den här sidan är kanske inte den mest nödvändiga delen av min
                portfölj, men du tog dig ända hit. Det uppskattar jag.
              </p>
              <button class="button" id="surprise-button" type="button">
                Tryck absolut inte här
              </button>
              <p class="surprise-message" id="surprise-message" aria-live="polite"></p>
              <a class="text-link" href="/">Tillbaka till startsidan →</a>
            </div>
          </article>
        </div>
      </section>
    </main>
    <footer class="site-footer"></footer>
  </body>
</html>
